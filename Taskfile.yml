version: '3'

tasks:
  electron:dev:
    desc: Start the Electron application in foreground (interactive). Use PROJECT=<path> to specify project.
    cmds:
      - ./scripts/electron-app.sh dev "{{.PROJECT}}"

  electron:start:
    desc: Start the Electron application in background. Use PROJECT=<path> to specify project.
    cmds:
      - ./scripts/electron-app.sh start "{{.PROJECT}}"

  electron:stop:
    desc: Stop the running Electron application
    cmds:
      - ./scripts/electron-app.sh stop

  electron:restart:
    desc: Restart the Electron application. Use PROJECT=<path> to specify project.
    cmds:
      - ./scripts/electron-app.sh restart "{{.PROJECT}}"

  electron:status:
    desc: Show Electron application status
    cmds:
      - ./scripts/electron-app.sh status

  electron:logs:
    desc: Show and follow Electron application logs
    cmds:
      - ./scripts/electron-app.sh logs

  electron:build:
    desc: Build the Electron application
    dir: electron-sdd-manager
    cmds:
      - npm run build:electron

  remote:dev:
    desc: Start remote-ui (web) development server
    dir: electron-sdd-manager
    cmds:
      - npm run dev:remote

  remote:build:
    desc: Build remote-ui (web) for production
    dir: electron-sdd-manager
    cmds:
      - npm run build:remote

  remote:preview:
    desc: Preview built remote-ui (web)
    dir: electron-sdd-manager
    cmds:
      - npm run preview:remote

  electron:test:
    desc: Run unit tests (watch mode)
    dir: electron-sdd-manager
    cmds:
      - npm run test {{.CLI_ARGS}}

  electron:test:run:
    desc: Run unit tests (single run)
    dir: electron-sdd-manager
    cmds:
      - npm run test:run {{.CLI_ARGS}}

  electron:test:report:
    desc: Run unit tests and generate failure-only markdown report
    dir: electron-sdd-manager
    cmds:
      - cmd: npm run test:run
        ignore_error: true
      - npx ts-node ../scripts/parse-unit-test-results.ts

  electron:test:report:parse:
    desc: Re-parse existing vitest JSON into markdown report
    cmds:
      - npx ts-node scripts/parse-unit-test-results.ts

  electron:test:e2e:
    desc: Run E2E tests for Electron application
    dir: electron-sdd-manager
    cmds:
      - npm run test:e2e

  electron:test:e2e:remote:
    desc: Run E2E tests on remote machine (requires REMOTE_E2E_HOST and REMOTE_E2E_USER)
    cmds:
      - ./scripts/run-remote-e2e.sh
    env:
      REMOTE_E2E_HOST: "{{.REMOTE_E2E_HOST}}"
      REMOTE_E2E_USER: "{{.REMOTE_E2E_USER}}"

  electron:test:e2e:remote:kdg069:
    desc: Run E2E tests on KDG-069 (yuji@172.25.76.196)
    cmds:
      - ./scripts/run-remote-e2e.sh
    env:
      REMOTE_E2E_HOST: "172.25.76.196"
      REMOTE_E2E_USER: "yuji"

  electron:check:remote:kdg069:
    desc: Check KDG-069 environment for E2E testing
    cmds:
      - ./scripts/check-remote-environment.sh
    env:
      REMOTE_E2E_HOST: "172.25.76.196"
      REMOTE_E2E_USER: "yuji"

  electron:check:remote:
    desc: Check remote machine environment for E2E testing
    cmds:
      - ./scripts/check-remote-environment.sh
    env:
      REMOTE_E2E_HOST: "{{.REMOTE_E2E_HOST}}"
      REMOTE_E2E_USER: "{{.REMOTE_E2E_USER}}"

  electron:cleanup:
    desc: Kill zombie Electron processes from E2E tests (safe - only kills orphaned processes)
    cmds:
      - ./scripts/cleanup-zombie-electrons.sh {{.CLI_ARGS}}

  logs:agent:
    desc: Show formatted Agent output logs (human-readable)
    cmds:
      - npx ts-node scripts/format-logs.ts {{.CLI_ARGS}}

  logs:agent:verbose:
    desc: Show formatted Agent output logs with details
    cmds:
      - npx ts-node scripts/format-logs.ts -v {{.CLI_ARGS}}

  logs:agent:all:
    desc: Show all Agent output logs
    cmds:
      - npx ts-node scripts/format-logs.ts -a {{.CLI_ARGS}}

  logs:main:
    desc: Show main process logs
    cmds:
      - npx ts-node scripts/format-logs.ts -f logs/main.log {{.CLI_ARGS}}
